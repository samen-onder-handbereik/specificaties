<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API-specificaties - Samen onder Handbereik</title>
  <link rel="shortcut icon" type="image/x-icon" href="https://leongrinwis.github.io/respectvngorg/media/handenblauwlogosmall.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff;
    }
    .soh-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #154273;
      color: #fff;
    }
    .soh-header h1 {
      margin: 0 auto 0 0;
      font-size: 1.2em;
    }
    .soh-header a {
      color: #fff;
    }
    .soh-header select,
    .soh-header .soh-button {
      font-size: 0.95em;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #fff;
    }
    .soh-header .soh-nav {
      font-weight: bold;
    }
    .soh-header .soh-button {
      color: #154273;
      background: #fff;
      text-decoration: none;
    }
    .soh-embed .soh-header,
    .soh-embed .swagger-ui .information-container {
      display: none;
    }
  </style>
</head>

<body>
  <header class="soh-header">
    <h1><a href="index.html">Specificatie samenwerkfuncties</a> · API's</h1>
    <a class="soh-nav" href="kennis-graph.html">Kennis-graph</a>
    <label for="soh-spec">Specificatie</label>
    <select id="soh-spec"></select>
    <a class="soh-button" id="soh-download" href="#">Download YAML</a>
    <a class="soh-button" id="soh-editor" href="#" target="_blank" rel="noopener">Open in Swagger Editor</a>
  </header>
  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    const specs = [
      { name: "AsynchroneInteracties", title: "Asynchrone Interacties" },
      { name: "Melding", title: "Melding" },
      { name: "UitkomstOverleg", title: "Uitkomst Overleg (Inzage-API)" },
      { name: "UitwisselenUitkomstOverleg", title: "Uitwisselen Uitkomst Overleg" },
    ];
    const publishedBase = "https://samen-onder-handbereik.github.io/specificaties/";
    const editorBase = "https://editor.swagger.io/?url=";

    if (new URLSearchParams(location.search).has("embed")) {
      document.body.classList.add("soh-embed");
    }

    const select = document.getElementById("soh-spec");
    for (const spec of specs) {
      select.add(new Option(spec.title, spec.name));
    }

    function show(name) {
      const file = `yaml/${name}.yaml`;
      select.value = name;
      document.getElementById("soh-download").href = file;
      document.getElementById("soh-editor").href = editorBase + encodeURIComponent(publishedBase + file);
      SwaggerUIBundle({
        url: file,
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 0,
        supportedSubmitMethods: [],
      });
    }

    select.addEventListener("change", () => {
      const params = new URLSearchParams(location.search);
      params.set("spec", select.value);
      history.pushState(null, "", `?${params}`);
      show(select.value);
    });
    window.addEventListener("popstate", () => show(currentSpec()));

    function currentSpec() {
      const requested = new URLSearchParams(location.search).get("spec");
      return specs.some((spec) => spec.name === requested) ? requested : specs[0].name;
    }

    show(currentSpec());
  </script>
</body>

</html>
