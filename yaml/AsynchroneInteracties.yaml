# Generieke Asynchrone Interactie API
#
# Deze OpenAPI-specificatie beschrijft het generieke mechanisme voor:
# - het aanbieden van CloudEvents;
# - het asynchroon verwerken van interacties;
# - het opvragen van de status van een interactie;
# - het ophalen van het resultaat van een interactie.
#
# De inhoudelijke betekenis van specifieke gebeurtenissen wordt bepaald door
# de betreffende samenwerkfunctie. Deze specificatie beschrijft uitsluitend
# het generieke interactiepatroon.

openapi: 3.1.0

info:
  title: Generieke Asynchrone Interactie API
  version: 2.0.0
  description: |
    Generieke API voor:
    - het aanbieden van CloudEvents;
    - het volgen van de status van asynchrone interacties;
    - het ophalen van het resultaat van een asynchrone interactie.

    Een samenwerkfunctie bepaalt welke CloudEvent-profielen worden gebruikt
    en welke gegevens in de payload worden opgenomen.

    Endpoint-naamgeving en versiebeheer:

    De API gebruikt resourcegerichte endpoints. Daarom worden geen
    actiewoorden zoals 'registreer' of 'verwerk' opgenomen in endpointnamen.
    De HTTP-methode beschrijft de uit te voeren actie.

    Er wordt geen versienummer opgenomen in het endpointpad zolang wijzigingen
    compatibel blijven met het bestaande API-contract. Versiebeheer vindt
    plaats via de versie van de OpenAPI-specificatie.

    Statusmodel:

    StatusResponse is gemodelleerd als een polymorf schema met een discriminator
    op het attribuut 'status'. De varianten StatusOK, StatusInProgress en
    StatusError leggen ieder hun eigen statuswaarde vast. Hierdoor is de
    statuswaarde onderdeel van het concrete schemacontract en blijft het
    model bruikbaar voor codegeneratie.

    Resultaatmodel:

    De interactie wordt opgevraagd via GET /interacties/{interactieId}; deze
    resource bevat onder meer de actuele verwerkingsstatus. Een eventueel
    resultaat is een gerelateerde resource via
    GET /interacties/{interactieId}/resultaat. De concrete structuur van het
    resultaat wordt bepaald door de betreffende samenwerkfunctie en wordt als
    CloudEvent aangeboden.

    Voorbeelden:

    Voorbeelden zijn opgenomen op mediatype-niveau bij de betreffende
    request- en responsdefinities. Zij maken geen deel uit van het
    schemacontract en hebben daarmee geen invloed op codegeneratie.

tags:
  - name: CloudEvent API
    description: Endpoint voor het aanbieden van CloudEvents.
  - name: Interacties
    description: Endpoints voor het opvragen van een interactie, de status en een eventueel resultaat.

paths:

  /events:
    post:
      tags:
        - CloudEvent API
      summary: Bied een CloudEvent aan
      description: |
        Een deelnemer biedt een CloudEvent aan voor asynchrone verwerking.

        Het attribuut type en de inhoud van data worden niet door deze
        generieke API vastgesteld. Deze worden bepaald door het
        CloudEvent-profiel van een samenwerkfunctie.

        Het HTTP-mediatype van het aangeboden CloudEvent is
        application/cloudevents+json. Dit mediatype beschrijft de volledige
        HTTP-body: de body is zelf het CloudEvent.

        Het CloudEvent-attribuut datacontenttype beschrijft daarentegen het
        mediatype van de inhoud van data, bijvoorbeeld application/ld+json
        wanneer data een PROV/JSON-LD-graaf bevat.

        Bij succesvolle acceptatie wordt de interactie geregistreerd en
        wordt HTTP-status 202 Accepted geretourneerd. De response-body bevat
        het uitgegeven interactieId.

        HTTP-foutresponses met statuscode 4xx of 5xx gebruiken
        application/problem+json en volgen RFC 9457 (Problem Details).
        Bij 400 Bad Request bevat de response daarnaast een errors-lijst
        met validatiefouten, overeenkomstig de NLGov REST API Design Rules.
      operationId: aanbiedCloudEvent

      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
            examples:
              cloudEvent:
                summary: CloudEvent met samenwerkfunctie-specifieke payload
                value:
                  specversion: "1.0"
                  id: "123e4567-e89b-42d3-a456-426614174000"
                  source: "urn:nld:oin:00000001823288444000:systeem:uitkomstoverleg"
                  type: "nl.jzv.voorbeeld-samenwerkfunctie.voorbeeld-gebeurtenis"
                  time: "2026-01-15T09:30:00Z"
                  subject: "voorbeeldonderwerp"
                  data:
                    bericht: "Samenwerkfunctie-specifieke inhoud"

      responses:
        '202':
          description: CloudEvent geaccepteerd voor asynchrone verwerking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptatieResponse'
              examples:
                geaccepteerd:
                  summary: Interactie geregistreerd
                  value:
                    interactieId: "987e6543-e21b-45d6-b789-426614174111"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /interacties/{interactieId}:
    get:
      tags:
        - Interacties
      summary: Vraag interactie en status op
      description: |
        Geeft een eerder aangeboden interactie weer, met de actuele status van de verwerking. De interactieId wordt uitgegeven door de voorziening die verantwoordelijk is voor de verwerking. Het resultaat wordt via de gerelateerde resource /interacties/{interactieId}/resultaat opgevraagd.

        Een ongeldige interactieId resulteert in HTTP 400 Bad Request.
        Als de interactie niet bestaat, wordt HTTP 404 Not Found geretourneerd.
        Deze HTTP-foutresponses gebruiken application/problem+json volgens RFC 9457.
        Bij 400 Bad Request bevat de response een errors-lijst. De ADR specificeert
        voor die lijst de waarden body en query voor het attribuut in; de concrete
        API moet de foutlocatie daarom op die manier kunnen representeren.
        Een status ERROR is daarentegen een verwerkingsstatus: het opvragen van
        de status is geslaagd en wordt daarom als HTTP 200 met status ERROR
        teruggegeven, niet als Problem Details-response.
      operationId: vraagInteractieOp

      parameters:
        - name: interactieId
          in: path
          required: true
          description: Identifier van de asynchrone interactie.
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-42d3-a456-426614174000"

      responses:
        '200':
          description: Status van de interactie, inclusief eventuele verwerkingsfout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                ok:
                  summary: Verwerking succesvol afgerond
                  value:
                    interactieId: "987e6543-e21b-45d6-b789-426614174111"
                    status: OK
                inProgress:
                  summary: Verwerking loopt nog
                  value:
                    interactieId: "987e6543-e21b-45d6-b789-426614174111"
                    status: IN_PROGRESS
                fout:
                  summary: Verwerking beëindigd met een fout
                  value:
                    interactieId: "987e6543-e21b-45d6-b789-426614174111"
                    status: ERROR
                    resultaat:
                      fout: "Het verzoek voldoet niet aan de afspraken van de samenwerkfunctie."
                      typeFout: FUNCTIONEEL
                      info:
                        veld: "identifier"
                        reden: "Waarde ontbreekt"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /interacties/{interactieId}/resultaat:
    get:
      tags:
        - Interacties
      summary: Vraag interactieresultaat op
      description: |
        Geeft het resultaat van een eerder aangeboden asynchrone interactie. Dit resultaat is een gerelateerde resource van /interacties/{interactieId}.

        De interactieId wordt uitgegeven door de voorziening die verantwoordelijk is voor de verwerking. Het resultaat wordt als CloudEvent aangeboden.

        Een ongeldige interactieId resulteert in HTTP 400 Bad Request.
        Als de interactie niet bestaat, wordt HTTP 404 Not Found geretourneerd.
        Deze HTTP-foutresponses gebruiken application/problem+json volgens RFC 9457.
        Bij 400 Bad Request bevat de response een errors-lijst. De ADR specificeert
        voor die lijst de waarden body en query voor het attribuut in; de concrete
        API moet de foutlocatie daarom op die manier kunnen representeren.
        De concrete API-specificatie bepaalt welke foutstatus wordt gebruikt als
        er nog geen resultaat beschikbaar is. Dit is onderscheiden van een niet-bestaande interactie.

        De concrete structuur en betekenis van het CloudEvent worden bepaald door het
        CloudEvent-profiel van de betreffende samenwerkfunctie.
      operationId: vraagResultaatOp

      parameters:
        - name: interactieId
          in: path
          required: true
          description: Identifier van de asynchrone interactie.
          schema:
            type: string
            format: uuid
          example: "987e6543-e21b-45d6-b789-426614174111"

      responses:
        '200':
          description: Resultaat van de interactie als CloudEvent.
          content:
            application/cloudevents+json:
              schema:
                $ref: '#/components/schemas/CloudEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    BadRequest:
      description: Het request bevat ongeldige invoer.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    description: Geordende lijst van validatiefouten.
                    items:
                      $ref: '#/components/schemas/ValidationError'
          example:
            status: 400
            title: Ongeldige invoer
            detail: Een of meer velden in het request zijn ongeldig.
            errors:
              - in: body
                location: "#/data/identifier"
                code: required
                detail: Dit veld is verplicht.
    NotFound:
      description: De gevraagde interactie of het resultaat bestaat niet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            status: 404
            title: Niet gevonden
            detail: Er bestaat geen interactie met de opgegeven interactieId.
    InternalServerError:
      description: Er is een onverwachte fout opgetreden bij het verwerken van het request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            status: 500
            title: Interne serverfout
            detail: Er is een onverwachte fout opgetreden.

  schemas:
    ProblemDetails:
      type: object
      description: Foutrepresentatie volgens RFC 9457 en de NLGov REST API Design Rules.
      required: [status, title, detail]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI die het type probleem identificeert.
        title:
          type: string
          description: Korte, voor mensen leesbare samenvatting van het probleem.
        status:
          type: integer
          description: HTTP-statuscode van deze foutresponse.
        detail:
          type: string
          description: Uitleg van het probleem voor deze specifieke situatie.
        instance:
          type: string
          format: uri-reference
          description: URI die deze specifieke probleeminstantie identificeert.
      additionalProperties: true

    ValidationError:
      type: object
      required: [in, detail]
      properties:
        in:
          type: string
          enum: [body, query]
          description: Waar de fout is aangetroffen.
        detail:
          type: string
          description: Menselijk leesbare beschrijving van de validatiefout.
        location:
          type: string
          description: JSON Pointer naar de ongeldige waarde of de naam van een queryparameter.
        index:
          type: integer
          minimum: 0
          description: Nulgebaseerde index bij meerdere queryparameters met dezelfde naam.
        code:
          type: string
          description: Stabiele machineleesbare code voor de validatiefout.

    StatusValue:
      type: string
      enum: [ OK, IN_PROGRESS, ERROR ]
      description: Mogelijke statuswaarden van de interactie.

    CloudEvent:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
        id:
          type: string
          format: uuid
          description: |
            Unieke identifier van het CloudEvent.
            Het CloudEvent.id identificeert het CloudEvent zelf. De interactieId wordt
            afzonderlijk uitgegeven door de voorziening die verantwoordelijk is voor de verwerking.
        source:
          type: string
          description: Bron die het CloudEvent heeft geproduceerd.
        type:
          type: string
          description: |
            Gebeurtenistype volgens het CloudEvent-profiel van de
            betreffende samenwerkfunctie.
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
          description: Mediatype van de inhoud van het CloudEvent-attribuut data.
        dataschema:
          type: string
          format: uri
          description: Optionele verwijzing naar het schema van data.
        data:
          type: object
          description: Samenwerkfunctie-specifieke payload.

    AcceptatieResponse:
      type: object
      required:
        - interactieId
      properties:
        interactieId:
          type: string
          format: uuid
          description: |
            Identificatie van de asynchrone interactie.
            Deze waarde wordt uitgegeven door de voorziening die verantwoordelijk is
            voor de verwerking van de interactie en staat los van CloudEvent.id.

    StatusResponse:
      description: |
        Statusresponse van een asynchrone interactie.

        De concrete variant wordt bepaald door de waarde van status.
      oneOf:
        - $ref: '#/components/schemas/StatusOK'
        - $ref: '#/components/schemas/StatusInProgress'
        - $ref: '#/components/schemas/StatusError'
      discriminator:
        propertyName: status
        mapping:
          OK: '#/components/schemas/StatusOK'
          IN_PROGRESS: '#/components/schemas/StatusInProgress'
          ERROR: '#/components/schemas/StatusError'

    StatusOK:
      type: object
      required:
        - interactieId
        - status
      properties:
        interactieId:
          type: string
          format: uuid
          description: Identificatie van de asynchrone interactie.
        status:
          const: OK

    StatusInProgress:
      type: object
      required:
        - interactieId
        - status
      properties:
        interactieId:
          type: string
          format: uuid
          description: Identificatie van de asynchrone interactie.
        status:
          const: IN_PROGRESS

    StatusError:
      type: object
      required:
        - interactieId
        - status
        - resultaat
      properties:
        interactieId:
          type: string
          format: uuid
          description: Identificatie van de asynchrone interactie.
        status:
          const: ERROR
        resultaat:
          $ref: '#/components/schemas/ErrorResultaat'

    ErrorResultaat:
      type: object
      required: [ fout, typeFout ]
      properties:
        fout:
          type: string
          description: Beschrijving van de fout.
        typeFout:
          type: string
          enum: [ FUNCTIONEEL, TECHNISCH ]
          description: |
            Classificatie van de fout.
        info:
          type: object
          description: |
            Aanvullende informatie over de fout.
            De structuur kan afhankelijk zijn van het fouttype.
          additionalProperties: true