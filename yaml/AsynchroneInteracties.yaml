# Generieke Asynchrone Interactie API
#
# Deze OpenAPI-specificatie beschrijft het generieke mechanisme voor:
# - het aanbieden van CloudEvents;
# - het asynchroon verwerken van interacties;
# - het opvragen van de status van een interactie;
# - het ophalen van het resultaat van een interactie.
#
# De inhoudelijke betekenis van specifieke gebeurtenissen wordt bepaald door
# de betreffende samenwerkfunctie. Deze specificatie beschrijft uitsluitend
# het generieke interactiepatroon.

openapi: 3.1.0

info:
  title: Generieke Asynchrone Interactie API
  version: 1.2.0
  description: |
    Generieke API voor:
    - het aanbieden van CloudEvents;
    - het volgen van de status van asynchrone interacties;
    - het ophalen van het resultaat van een asynchrone interactie.

    Een samenwerkfunctie bepaalt welke CloudEvent-profielen worden gebruikt
    en welke gegevens in de payload worden opgenomen.

    Endpoint-naamgeving en versiebeheer:

    De API gebruikt resourcegerichte endpoints. Daarom worden geen
    actiewoorden zoals 'registreer' of 'verwerk' opgenomen in endpointnamen.
    De HTTP-methode beschrijft de uit te voeren actie.

    Er wordt geen versienummer opgenomen in het endpointpad zolang wijzigingen
    compatibel blijven met het bestaande API-contract. Versiebeheer vindt
    plaats via de versie van de OpenAPI-specificatie.

    Statusmodel:

    StatusResponse is gemodelleerd als een polymorf schema met een discriminator
    op het attribuut 'status'. De varianten StatusOK, StatusInProgress en
    StatusError leggen ieder hun eigen statuswaarde vast. Hierdoor is de
    statuswaarde onderdeel van het concrete schemacontract en blijft het
    model bruikbaar voor codegeneratie.

    Resultaatmodel:

    Het resultaat van een asynchrone interactie wordt opgehaald via de
    Resultaat API. De concrete structuur van het resultaat wordt bepaald door
    de betreffende samenwerkfunctie en wordt als CloudEvent aangeboden.

    Voorbeelden:

    Voorbeelden zijn opgenomen op mediatype-niveau bij de betreffende
    request- en responsdefinities. Zij maken geen deel uit van het
    schemacontract en hebben daarmee geen invloed op codegeneratie.

tags:
  - name: CloudEvent API
    description: Endpoint voor het aanbieden van CloudEvents.
  - name: Status API
    description: Endpoint voor het volgen van de status van asynchrone interacties.
  - name: Resultaat API
    description: Endpoint voor het ophalen van het resultaat van een asynchrone interactie.

paths:

  /events:
    post:
      tags:
        - CloudEvent API
      summary: Bied een CloudEvent aan
      description: |
        Een deelnemer biedt een CloudEvent aan voor asynchrone verwerking.

        Het attribuut type en de inhoud van data worden niet door deze
        generieke API vastgesteld. Deze worden bepaald door het
        CloudEvent-profiel van een samenwerkfunctie.

        Het HTTP-mediatype van het aangeboden CloudEvent is
        application/cloudevents+json. Dit mediatype beschrijft de volledige
        HTTP-body: de body is zelf het CloudEvent.

        Het CloudEvent-attribuut datacontenttype beschrijft daarentegen het
        mediatype van de inhoud van data, bijvoorbeeld application/ld+json
        wanneer data een PROV/JSON-LD-graaf bevat.

        Bij succesvolle acceptatie wordt de interactie geregistreerd en
        wordt HTTP-status 202 Accepted geretourneerd.
      operationId: aanbiedCloudEvent

      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
            examples:
              cloudEvent:
                summary: CloudEvent met samenwerkfunctie-specifieke payload
                value:
                  specversion: "1.0"
                  id: "urn:uuid:123e4567-e89b-12d3-a456-426614174000"
                  source: "urn:nld:oin:00000001823288444000:systeem:uitkomstoverleg"
                  type: "nl.jzv.voorbeeld-samenwerkfunctie.voorbeeld-gebeurtenis"
                  time: "2026-01-15T09:30:00Z"
                  subject: "voorbeeldonderwerp"
                  data:
                    bericht: "Samenwerkfunctie-specifieke inhoud"

      responses:
        '202':
          description: CloudEvent geaccepteerd voor asynchrone verwerking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptatieResponse'
              examples:
                geaccepteerd:
                  summary: Interactie geregistreerd
                  value:
                    interactieId: "urn:uuid:987e6543-e21b-45d6-b789-426614174111"

  /status/{interactieId}:
    get:
      tags:
        - Status API
      summary: Vraag status van interactie op
      description: |
        Geeft de actuele status van een eerder aangeboden interactie.

        De interactieId wordt uitgegeven door de voorziening die verantwoordelijk is voor de verwerking.
      operationId: vraagStatusOp

      parameters:
        - name: interactieId
          in: path
          required: true
          description: Identifier van de asynchrone interactie.
          schema:
            type: string
          example: "urn:uuid:123e4567-e89b-12d3-a456-426614174000"

      responses:
        '200':
          description: Status van de interactie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                ok:
                  summary: Verwerking succesvol afgerond
                  value:
                    interactieId: "urn:uuid:987e6543-e21b-45d6-b789-426614174111"
                    status: OK
                    resultaat:
                      voorbeeld: "resultaat"
                inProgress:
                  summary: Verwerking loopt nog
                  value:
                    interactieId: "urn:uuid:987e6543-e21b-45d6-b789-426614174111"
                    status: IN_PROGRESS
                fout:
                  summary: Verwerking beëindigd met een fout
                  value:
                    interactieId: "urn:uuid:987e6543-e21b-45d6-b789-426614174111"
                    status: ERROR
                    resultaat:
                      fout: "Validatie mislukt"
                      typeFout: FUNCTIONEEL
                      info:
                        veld: "identifier"
                        reden: "Waarde ontbreekt"

  /resultaten/{interactieId}:
    get:
      tags:
        - Resultaat API
      summary: Vraag resultaat van interactie op
      description: |
        Geeft het resultaat van een eerder aangeboden asynchrone interactie.

        De interactieId wordt uitgegeven door de voorziening die verantwoordelijk is voor de verwerking.
        Het resultaat wordt als CloudEvent aangeboden.

        De concrete structuur en betekenis van het CloudEvent worden bepaald door het
        CloudEvent-profiel van de betreffende samenwerkfunctie.
      operationId: vraagResultaatOp

      parameters:
        - name: interactieId
          in: path
          required: true
          description: Identifier van de asynchrone interactie.
          schema:
            type: string
          example: "urn:uuid:987e6543-e21b-45d6-b789-426614174111"

      responses:
        '200':
          description: Resultaat van de interactie als CloudEvent.
          content:
            application/cloudevents+json:
              schema:
                $ref: '#/components/schemas/CloudEvent'

components:

  schemas:

    StatusValue:
      type: string
      enum: [ OK, IN_PROGRESS, ERROR ]
      description: Mogelijke statuswaarden van de interactie.

    CloudEvent:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
        id:
          type: string
          description: |
            Unieke identifier van het CloudEvent.
            Het CloudEvent.id identificeert het CloudEvent zelf. De interactieId wordt
            afzonderlijk uitgegeven door de voorziening die verantwoordelijk is voor de verwerking.
        source:
          type: string
          description: Bron die het CloudEvent heeft geproduceerd.
        type:
          type: string
          description: |
            Gebeurtenistype volgens het CloudEvent-profiel van de
            betreffende samenwerkfunctie.
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
          description: Mediatype van de inhoud van het CloudEvent-attribuut data.
        dataschema:
          type: string
          format: uri
          description: Optionele verwijzing naar het schema van data.
        data:
          type: object
          description: Samenwerkfunctie-specifieke payload.

    AcceptatieResponse:
      type: object
      required:
        - interactieId
      properties:
        interactieId:
          type: string
          description: |
            Identificatie van de asynchrone interactie.
            Deze waarde wordt uitgegeven door de voorziening die verantwoordelijk is
            voor de verwerking van de interactie en staat los van CloudEvent.id.

    StatusResponse:
      description: |
        Statusresponse van een asynchrone interactie.

        De concrete variant wordt bepaald door de waarde van status.
      oneOf:
        - $ref: '#/components/schemas/StatusOK'
        - $ref: '#/components/schemas/StatusInProgress'
        - $ref: '#/components/schemas/StatusError'
      discriminator:
        propertyName: status
        mapping:
          OK: '#/components/schemas/StatusOK'
          IN_PROGRESS: '#/components/schemas/StatusInProgress'
          ERROR: '#/components/schemas/StatusError'

    StatusOK:
      type: object
      required:
        - interactieId
        - status
      properties:
        interactieId:
          type: string
          description: Identificatie van de asynchrone interactie.
        status:
          const: OK

    StatusInProgress:
      type: object
      required:
        - interactieId
        - status
      properties:
        interactieId:
          type: string
          description: Identificatie van de asynchrone interactie.
        status:
          const: IN_PROGRESS

    StatusError:
      type: object
      required:
        - interactieId
        - status
        - resultaat
      properties:
        interactieId:
          type: string
          description: Identificatie van de asynchrone interactie.
        status:
          const: ERROR
        resultaat:
          $ref: '#/components/schemas/ErrorResultaat'

    ErrorResultaat:
      type: object
      required: [ fout, typeFout ]
      properties:
        fout:
          type: string
          description: Beschrijving van de fout.
        typeFout:
          type: string
          enum: [ FUNCTIONEEL, TECHNISCH ]
          description: |
            Classificatie van de fout.
        info:
          type: object
          description: |
            Aanvullende informatie over de fout.
            De structuur kan afhankelijk zijn van het fouttype.
          additionalProperties: true