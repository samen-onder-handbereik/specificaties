      value:
        specversion: "1.0"
        id: "019bb6c0-1234-7abc-8def-426614174004"
        source: "urn:organisatie:queryvoorziening"
        type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-overleg-query-resultaat"
        time: "2026-01-15T12:00:00Z"
        subject: "987e6543-e21b-45d6-b789-426614174111"
        datacontenttype: "application/ld+json"
        dataschema: "https://samen-onder-handbereik.github.io/specificaties/jsonschema/prov-jsonld.schema.json"
        data:
          "@context":
            prov: "http://www.w3.org/ns/prov#"
            soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
          "@graph":
            - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e54"
              "@type":
                - "prov:Entity"
                - "soh:UitkomstOverleg"
              "soh:UitkomstOverleg.beschikbaarGesteldOp": "2026-01-15T10:30:00Z"
              "soh:inzageUrl": "https://inzage.voorbeeld.nl/inzage/uitkomst-overleg/casusoverleg-98765"
              "soh:UitkomstOverleg.heeftBetrokkene":
                "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e55"
              "prov:wasGeneratedBy":
                "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e50"
            - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e50"
              "@type":
                - "prov:Activity"
              "prov:wasAssociatedWith":
                "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e52"
            - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e52"
