  schemas:

    ProblemDetails:
      description: |
        Foutrepresentatie voor HTTP-foutresponses conform RFC 9457 en
        de NLGov REST API Design Rules.
      type: object
      required:
        - status
        - title
        - detail
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI die het type probleem identificeert.
        title:
          type: string
          description: Korte, menselijk leesbare samenvatting van het probleem.
        status:
          type: integer
          description: HTTP-statuscode van deze foutresponse.
        detail:
          type: string
          description: Menselijk leesbare uitleg van dit specifieke probleem.
        instance:
          type: string
          format: uri-reference
          description: URI-referentie naar deze specifieke probleeminstantie.
      additionalProperties: true

    BadRequestProblemDetails:
      description: |
        Problem Details voor een ongeldige aanvraag. De errors-lijst bevat
        validatiefouten conform de NLGov REST API Design Rules.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - in
                  - detail
                properties:
                  in:
                    type: string
                    enum:
                      - body
                      - query
                    description: Waar de fout optreedt.
                  detail:
                    type: string
                    description: Menselijk leesbare beschrijving van de validatiefout.
                  location:
                    type: string
                    description: JSON Pointer naar de ongeldige waarde in de request-body, of de naam van een queryparameter.
                  index:
                    type: integer
                    minimum: 0
                    description: Nulgebaseerde index bij herhaalde queryparameters.
                  code:
                    type: string
                    description: Optionele machineleesbare foutcode.

    Identificatie:
      description: |
        Identificatie van een Betrokkene. De identificatie bestaat uit een
        typering en de bijbehorende waarde. De typering is een stabiele code
        uit een beheerde waardelijst, bijvoorbeeld "BSN" of "V-NUMMER".
      type: object
      required:
        - identificatieType
        - identificatie
      properties:
        identificatieType:
          type: string
          description: Code die aangeeft om welk soort identificatienummer het gaat.
          examples:
            - "BSN"
            - "V-NUMMER"
        identificatie:
          type: string
          description: Waarde van het identificatienummer; als string om opmaak en voorloopnullen te behouden.
          example: "123456789"
      additionalProperties: false

    BetrokkeneGraphNode:
      description: |
        Voorbeeldschema voor een Betrokkene in de PROV/JSON-LD-graaf. De @id
        identificeert de graph-node met een UUIDv7-URI. De persoonsidentificatie wordt daarnaast weergegeven met een typering en
        een waarde; deze vervangen de @id niet.
      type: object
      required:
        - "@id"
        - "@type"
        - "soh:Betrokkene.identificatieType"
        - "soh:Betrokkene.identificatieWaarde"
      properties:
        "@id":
          type: string
          format: uri
          pattern: '^urn:uuid:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: UUIDv7-URI die deze Betrokkene-node in de Knowledge Graph identificeert.
        "@type":
          type: array
          items:
            type: string
          description: PROV- en domeintypen van de Betrokkene-node.
        "soh:Betrokkene.identificatieType":
          type: string
          description: Code die het soort identificatienummer van de Betrokkene aanduidt.
          examples:
            - "BSN"
            - "V-NUMMER"
        "soh:Betrokkene.identificatieWaarde":
          type: string
          description: Waarde van het identificatienummer, weergegeven als string.
          example: "123456789"
        "soh:Betrokkene.woonplaats":
          type: string
          description: Woonplaats van de Betrokkene.
          example: "Deventer"

    OrganisatieGraphNode:
      description: |
        Voorbeeldschema voor een Organisatie in de PROV/JSON-LD-graaf. De @id
        identificeert de graph-node met een UUIDv7-URI. De organisatie-identificatie
        wordt daarnaast weergegeven met een typering en een waarde; deze vervangen
        de @id niet.
      type: object
      required:
        - "@id"
        - "@type"
        - "soh:Organisatie.identificatieType"
        - "soh:Organisatie.identificatieWaarde"
      properties:
        "@id":
          type: string
          format: uri
          pattern: '^urn:uuid:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: UUIDv7-URI die deze Organisatie-node in de Knowledge graph identificeert.
        "@type":
          type: array
          items:
            type: string
          description: PROV- en domeintypen van de Organisatie-node.
        "soh:Organisatie.identificatieType":
          type: string
          description: Code die het soort organisatie-identificatienummer aanduidt.
          examples:
            - "OIN"
            - "KVK"
        "soh:Organisatie.identificatieWaarde":
          type: string
          description: Waarde van het organisatie-identificatienummer, weergegeven als string.
          example: "00000000000000000000"

    QueryRequest:
      description: |
        Zoekcriteria voor beschikbare Uitkomsten Overleg. De persoonsidentificatie
        bestaat uit een typering en een waarde en is niet de identifier van de
        Betrokkene in de Knowledge Graph. Bij zoeken op betrokkeneWoonplaats worden
        hoofdletterverschillen genegeerd.
      type: object
      properties:
        betrokkeneIdentificatie:
          $ref: '#/components/schemas/Identificatie'
        betrokkeneWoonplaats:
          type: string
          description: |
            Zoek naar Uitkomsten Overleg waarbij een Betrokkene woont in de
            opgegeven woonplaats. De vergelijking is hoofdletterongevoelig.
            Andere verschillen, zoals spaties of afwijkende schrijfwijzen,
            worden niet automatisch genegeerd.
          example: "Deventer"
        beschikbaarVanaf:
          type: string
          format: date-time
          description: |
            Geef alleen Uitkomsten Overleg terug die vanaf dit moment
            beschikbaar zijn gesteld.
        beschikbaarTot:
          type: string
          format: date-time
          description: |
            Geef alleen Uitkomsten Overleg terug die tot dit moment
            beschikbaar zijn gesteld.

    # Het generieke CloudEvent-contract wordt uitgebreid met de afspraken
    # voor deze samenwerkfunctie.
    UitkomstBeschikbaarGesteldEvent:
      description: |
        CloudEvent-profiel voor beschikbaarstelling van een Uitkomst Overleg.

        Een voorbeeld van een instantie van dit CloudEvent is opgenomen in:
        components/examples/UitkomstBeschikbaarGesteldVoorbeeld.

        Dit profiel beschrijft de inhoudelijke invulling van een CloudEvent
        binnen deze samenwerkfunctie. Het aanbieden van het CloudEvent zelf
        gebeurt via de generieke Asynchrone Interactie API.
      examples:
        - specversion: "1.0"
          id: "019bb6c0-1234-7abc-8def-426614174003"
          source: "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e52"
          type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-beschikbaar-gesteld"
          time: "2026-01-15T10:30:00Z"
          subject: "casusoverleg-98765"
          datacontenttype: "application/ld+json"
          data:
            "@context":
              # De prefix soh verwijst naar het vocabularium van Samen Onder Handbereik.
              prov: "http://www.w3.org/ns/prov#"
              soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
            "@graph":
              - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e54"
                "@type":
                  - "prov:Entity"
                  - "soh:UitkomstOverleg"
                "soh:UitkomstOverleg.heeftBetrokkene":
                  "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e55"
                "prov:wasGeneratedBy":
                  "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e50"

              - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e50"
                "@type":
                  - "prov:Activity"
                "prov:wasAssociatedWith":
                  "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e52"

              - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e52"
                "@type":
                  - "prov:Agent"
              - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e55"
                "@type":
                  - "prov:Entity"
                  - "soh:Betrokkene"
                "soh:Betrokkene.identificatieType": "BSN"
                "soh:Betrokkene.identificatieWaarde": "123456789"
                "soh:Betrokkene.woonplaats": "Deventer"

      allOf:
        - $ref: './AsynchroneInteracties.yaml#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-beschikbaar-gesteld
            data:
              $ref: '#/components/schemas/ProvenancePayload'

    UitkomstIngezienEvent:
      description: |
        CloudEvent-profiel voor inzage van een Uitkomst Overleg.

        De provenance Activity representeert de feitelijke inzagehandeling.
        De bijbehorende Agent representeert de organisatie die de inzage
        heeft uitgevoerd.

        Bij inzage wordt vastgelegd welke organisatie de Uitkomst Overleg
        heeft ingezien. Deze informatie maakt onderdeel uit van de
        provenance-informatie.
      examples:
        - specversion: "1.0"
          id: "019bb6c0-1234-7abc-8def-426614174005"
          source: "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e53"
          type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-ingezien"
          time: "2026-01-15T11:00:00Z"
          subject: "casusoverleg-98765"
          datacontenttype: "application/ld+json"
          data:
            "@context":
              prov: "http://www.w3.org/ns/prov#"
              soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
            "@graph":
              - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e51"
                "@type":
                  - "prov:Activity"
                  - "soh:InzienUitkomstOverleg"
                "prov:used":
                  "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e54"
                "prov:wasAssociatedWith":
                  "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e53"

              - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e53"
                "@type":
                  - "prov:Agent"
                  - "soh:Organisatie"
                "soh:Organisatie.identificatieType": "OIN"
                "soh:Organisatie.identificatieWaarde": "00000000000000000000"
                # Agent die de inzage heeft uitgevoerd.

      allOf:
        - $ref: './AsynchroneInteracties.yaml#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-ingezien
            data:
              $ref: '#/components/schemas/ProvenancePayload'

    UitkomstOverleg:
      description: |
        Representatie van een Uitkomst Overleg.

        Deze resource bevat de gegevens waarmee een Uitkomst Overleg
        kan worden geraadpleegd via de inzagevoorziening.
      type: object
      properties:
        casusoverlegIdentifier:
          type: string
          description: |
            Identifier van het Casusoverleg in het bronsysteem waarop de
            Uitkomst Overleg betrekking heeft. Dit is geen afzonderlijke
            identifier van de Uitkomst Overleg zelf.
        beschikbaarGesteldOp:
          type: string
          format: date-time
          description: Moment waarop de Uitkomst Overleg beschikbaar is gesteld.
        inzageUrl:
          type: string
          format: uri
          example: "https://organisatie.example/inzage/uitkomst-overleg/casusoverleg-98765?peildatum=2026-01-15T10%3A30%3A00Z"
          description: |
            URL waarmee de Uitkomst Overleg kan worden ingezien.

            De URL gebruikt de identifier van het Casusoverleg in het pad.
            Optioneel kan de queryparameter peildatum worden toegevoegd met
            een datum-tijdwaarde conform RFC 3339. Als deze parameter aanwezig
            is, retourneert de Inzage-API de toestand zoals die op dat tijdstip
            bekend was; latere wijzigingen blijven buiten beschouwing. Zonder
            peildatum wordt de actuele toestand geretourneerd.

            De inzageUrl is een technische verwijzing en geen afzonderlijke
            identifier van de Uitkomst Overleg. Zie de specificatie
            UitwisselenUitkomstOverleg voor de volledige URL-afspraak.

    ProvenancePayload:
      description: |
        PROV/JSON-LD payload van een CloudEvent.
        De payload bevat een JSON-LD context en een graaf met de
        inhoudelijke informatie en de bijbehorende provenance. Een Betrokkene
        heeft een eigen domeinidentifier. Wanneer de Betrokkene in de payload
        is opgenomen, worden de persoonsidentificatie en de woonplaats als
        eigenschappen van de Betrokkene weergegeven met respectievelijk
        soh:Betrokkene.identificatieType en
        soh:Betrokkene.identificatieWaarde, en soh:Betrokkene.woonplaats.
      type: object
      required:
        - "@context"
        - "@graph"
      properties:
        "@context":
          type: object
          description: JSON-LD context voor de gebruikte vocabulaires.
        "@graph":
          type: array
          description: JSON-LD graaf met informatieobjecten en provenance.
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    UitkomstOverlegQueryResultEvent:
      description: |
        CloudEvent-profiel voor het resultaat van een informatievraag.

        De resultaatresource retourneert het resultaat als CloudEvent. De data
        van dit CloudEvent bevat de gevonden Uitkomsten Overleg in
        PROV/JSON-LD-vorm, inclusief de provenance die bij de gevonden
        informatie beschikbaar is.

        Dit CloudEvent representeert het queryresultaat en is geen
        reconstructie van de oorspronkelijke beschikbaarstellingsgebeurtenis.

        Wanneer een Betrokkene onderdeel is van het queryresultaat, bevat de
        graaf zowel de eigen identifier van de Betrokkene als de getypeerde
        persoonsidentificatie, bestaande uit soh:Betrokkene.identificatieType en
        soh:Betrokkene.identificatieWaarde. Daardoor is de identificatie voor afnemers
        interpreteerbaar zonder de identifier van de graph-node als
        persoonsidentificatienummer te gebruiken.
      allOf:
        - $ref: './AsynchroneInteracties.yaml#/components/schemas/CloudEvent'
        - type: object
          required:
            - subject
          properties:
            type:
              const: nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-overleg-query-resultaat
            subject:
              type: string
              format: uuid
              description: Het interactieId van de asynchrone informatievraag waarop het resultaat betrekking heeft.
            data:
              $ref: '#/components/schemas/ProvenancePayload'
