# Samenwerkfunctie-specifieke API
#
# Dit document beschrijft:
# - de CloudEvent-profielen voor Uitwisselen Uitkomst Overleg;
# - de Query API.
#
# Het aanbieden van CloudEvents zelf gebeurt via de generieke
# Asynchrone Interactie API.
#
# De scheiding is bewust:
# - AsynchroneInteracties.yaml beschrijft HOE events worden uitgewisseld.
# - Dit document beschrijft WELKE events binnen deze samenwerkfunctie bestaan.

openapi: 3.1.0

info:
  title: Uitwisselen Uitkomst Overleg API
  version: 1.2.0
  description: |
    Samenwerkfunctie-specifieke contracten voor CloudEvents en Query API.

    Deze specificatie bevat:
    - de CloudEvent-profielen die binnen deze samenwerkfunctie worden gebruikt;
    - de structuur van de CloudEvent-payload;
    - de Query API voor het asynchroon bevragen van de beschikbare informatie.

    De CloudEvent-profielen zijn opgenomen onder Components → Schemas.
    Het aanbieden van CloudEvents zelf gebeurt via de generieke
    Asynchrone Interactie API.

    Een Query wordt asynchroon verwerkt. De Query API retourneert bij
    acceptatie een interactieId. De status van de verwerking kan worden
    opgevraagd via de Status API. Het resultaat wordt opgehaald via de
    Resultaat API en wordt als CloudEvent aangeboden.

externalDocs:
  description: Generieke Asynchrone Interactie API
  url: ./AsynchroneInteracties.yaml

tags:
  - name: Query API
    description: Informatievragen op de Knowledge Graph.

paths:

  /uitkomsten-overleg/query:
    post:
      tags:
        - Query API
      summary: Zoek beschikbare Uitkomsten Overleg
      description: |
        Zoekt beschikbare Uitkomsten Overleg in de Knowledge Graph.

        De Query API bevraagt de informatie die beschikbaar is gesteld
        binnen de Knowledge Graph.

        Bij acceptatie wordt een interactieId geretourneerd. De status van
        de verwerking kan worden opgevraagd via de Status API. Zodra de
        verwerking is afgerond, kan het resultaat worden opgehaald via de
        Resultaat API.

        Het resultaat van de Query API is een CloudEvent. De data van dit
        CloudEvent bevat de gevonden informatie in PROV/JSON-LD-vorm.

        De Query API reconstrueert daarmee geen oorspronkelijke
        beschikbaarstellings- of inzagegebeurtenis. Het CloudEvent is het
        antwoordformaat van de Query API; de PROV/JSON-LD-data beschrijft
        de gevonden informatie en de bijbehorende provenance.

        Een POST wordt gebruikt zodat zoekcriteria, waaronder mogelijk
        gevoelige gegevens zoals een BSN, geen onderdeel vormen van de URL.
      operationId: zoekUitkomstenOverleg

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'

      responses:
        '202':
          description: Query geaccepteerd voor asynchrone verwerking.
          content:
            application/json:
              schema:
                $ref: './AsynchroneInteracties.yaml#/components/schemas/AcceptatieResponse'
              examples:
                geaccepteerd:
                  summary: Query geaccepteerd
                  value:
                    interactieId: "urn:uuid:987e6543-e21b-45d6-b789-426614174111"

components:

  examples:

    UitkomstBeschikbaarGesteldVoorbeeld:
      summary: CloudEvent waarmee een Uitkomst Overleg beschikbaar wordt gesteld
      value:
        specversion: "1.0"
        id: "event-12345"
        source: "urn:organisatie:voorbeeld"
        type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-beschikbaar-gesteld"
        time: "2026-01-15T10:30:00Z"
        subject: "uitkomst-overleg-98765"
        datacontenttype: "application/ld+json"
        data:
          "@context":
            prov: "http://www.w3.org/ns/prov#"
            soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
          "@graph":
            - "@id": "urn:uitkomst-overleg-98765"
              "@type":
                - "prov:Entity"
                - "soh:UitkomstOverleg"
              "soh:beschikbaarGesteldOp": "2026-01-15T10:30:00Z"

    UitkomstOverlegQueryResultEventVoorbeeld:
      summary: CloudEvent als antwoord van de Query API
      value:
        specversion: "1.0"
        id: "event-query-12345"
        source: "urn:organisatie:queryvoorziening"
        type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-overleg-query-resultaat"
        time: "2026-01-15T12:00:00Z"
        datacontenttype: "application/ld+json"
        dataschema: "https://samen-onder-handbereik.github.io/specificaties/jsonschema/prov-jsonld.schema.json"
        data:
          "@context":
            prov: "http://www.w3.org/ns/prov#"
            soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
          "@graph":
            - "@id": "urn:uitkomst-overleg-98765"
              "@type":
                - "prov:Entity"
                - "soh:UitkomstOverleg"
              "soh:beschikbaarGesteldOp": "2026-01-15T10:30:00Z"
              "soh:inzageUrl": "https://inzage.voorbeeld.nl/uitkomst/98765"
              "prov:wasGeneratedBy":
                "@id": "urn:activity:beschikbaarstellen:12345"
            - "@id": "urn:activity:beschikbaarstellen:12345"
              "@type":
                - "prov:Activity"
              "prov:wasAssociatedWith":
                "@id": "urn:organisatie:voorbeeld"
            - "@id": "urn:organisatie:voorbeeld"
              "@type":
                - "prov:Agent"

  schemas:

    QueryRequest:
      description: |
        Zoekcriteria voor beschikbare Uitkomsten Overleg.
      type: object
      properties:
        burgerservicenummer:
          type: string
          description: |
            BSN van de Betrokkene waarvoor beschikbare Uitkomsten Overleg
            worden gezocht.
        beschikbaarVanaf:
          type: string
          format: date-time
          description: |
            Geef alleen Uitkomsten Overleg terug die vanaf dit moment
            beschikbaar zijn gesteld.
        beschikbaarTot:
          type: string
          format: date-time
          description: |
            Geef alleen Uitkomsten Overleg terug die tot dit moment
            beschikbaar zijn gesteld.

    # Het generieke CloudEvent-contract wordt uitgebreid met de afspraken
    # voor deze samenwerkfunctie.
    UitkomstBeschikbaarGesteldEvent:
      description: |
        CloudEvent-profiel voor beschikbaarstelling van een Uitkomst Overleg.

        Een voorbeeld van een instantie van dit CloudEvent is opgenomen in:
        components/examples/UitkomstBeschikbaarGesteldVoorbeeld.

        Dit profiel beschrijft de inhoudelijke invulling van een CloudEvent
        binnen deze samenwerkfunctie. Het aanbieden van het CloudEvent zelf
        gebeurt via de generieke Asynchrone Interactie API.
      examples:
        - specversion: "1.0"
          id: "event-12345"
          source: "urn:organisatie:voorbeeld"
          type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-beschikbaar-gesteld"
          time: "2026-01-15T10:30:00Z"
          subject: "uitkomst-overleg-98765"
          datacontenttype: "application/ld+json"
          data:
            "@context":
              # De prefix soh verwijst naar het vocabularium van Samen Onder Handbereik.
              prov: "http://www.w3.org/ns/prov#"
              soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
            "@graph":
              - "@id": "urn:uitkomst-overleg-98765"
                "@type":
                  - "prov:Entity"
                  - "soh:UitkomstOverleg"
                "prov:wasGeneratedBy":
                  "@id": "urn:activity:beschikbaarstellen:12345"

              - "@id": "urn:activity:beschikbaarstellen:12345"
                "@type":
                  - "prov:Activity"
                "prov:wasAssociatedWith":
                  "@id": "urn:organisatie:voorbeeld"

              - "@id": "urn:organisatie:voorbeeld"
                "@type":
                  - "prov:Agent"

      allOf:
        - $ref: './AsynchroneInteracties.yaml#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-beschikbaar-gesteld
            data:
              $ref: '#/components/schemas/ProvenancePayload'

    UitkomstIngezienEvent:
      description: |
        CloudEvent-profiel voor inzage van een Uitkomst Overleg.

        De provenance Activity representeert de feitelijke inzagehandeling.
        De bijbehorende Agent representeert de organisatie die de inzage
        heeft uitgevoerd.

        Bij inzage wordt vastgelegd welke organisatie de Uitkomst Overleg
        heeft ingezien. Deze informatie maakt onderdeel uit van de
        provenance-informatie.
      examples:
        - specversion: "1.0"
          id: "event-67890"
          source: "urn:organisatie:inzage"
          type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-ingezien"
          time: "2026-01-15T11:00:00Z"
          subject: "uitkomst-overleg-98765"
          datacontenttype: "application/ld+json"
          data:
            "@context":
              prov: "http://www.w3.org/ns/prov#"
              soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
            "@graph":
              - "@id": "urn:activity:inzage:67890"
                "@type":
                  - "prov:Activity"
                  - "soh:InzienUitkomstOverleg"
                "prov:used":
                  "@id": "urn:uitkomst-overleg-98765"
                "prov:wasAssociatedWith":
                  "@id": "urn:organisatie:inzage"

              - "@id": "urn:organisatie:inzage"
                "@type":
                  - "prov:Agent"
                # Agent die de inzage heeft uitgevoerd.

      allOf:
        - $ref: './AsynchroneInteracties.yaml#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-ingezien
            data:
              $ref: '#/components/schemas/ProvenancePayload'

    UitkomstOverleg:
      description: |
        Representatie van een Uitkomst Overleg.

        Deze resource bevat de gegevens waarmee een Uitkomst Overleg
        kan worden geraadpleegd via de inzagevoorziening.
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string
          description: Unieke identifier van de UitkomstOverleg-resource.
        beschikbaarGesteldOp:
          type: string
          format: date-time
          description: Moment waarop de Uitkomst Overleg beschikbaar is gesteld.
        inzageUrl:
          type: string
          format: uri
          description: |
            URL waarmee de Uitkomst Overleg kan worden ingezien.

            De inzageUrl verwijst naar de inzagevoorziening en is geen
            primaire identifier van de UitkomstOverleg-resource.

            De opbouw van de inzageUrl wordt beschreven in de
            specificatie UitwisselenUitkomstOverleg.

    ProvenancePayload:
      description: |
        PROV/JSON-LD payload van een CloudEvent.
        De payload bevat een JSON-LD context en een graaf met de
        inhoudelijke informatie en de bijbehorende provenance.
      type: object
      required:
        - "@context"
        - "@graph"
      properties:
        "@context":
          type: object
          description: JSON-LD context voor de gebruikte vocabulaires.
        "@graph":
          type: array
          description: JSON-LD graaf met informatieobjecten en provenance.
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    UitkomstOverlegQueryResultEvent:
      description: |
        CloudEvent-profiel voor het resultaat van de Query API.

        De Resultaat API retourneert het resultaat als CloudEvent. De data
        van dit CloudEvent bevat de gevonden Uitkomsten Overleg in
        PROV/JSON-LD-vorm, inclusief de provenance die bij de gevonden
        informatie beschikbaar is.

        Dit CloudEvent representeert het queryresultaat en is geen
        reconstructie van de oorspronkelijke beschikbaarstellingsgebeurtenis.
      allOf:
        - $ref: './AsynchroneInteracties.yaml#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-overleg-query-resultaat
            data:
              $ref: '#/components/schemas/ProvenancePayload'
