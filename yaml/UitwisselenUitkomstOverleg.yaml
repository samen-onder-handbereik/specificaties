# Samenwerkfunctie-specifieke API
#
# Dit document beschrijft:
# - de CloudEvent-profielen voor Uitwisselen Uitkomst Overleg;
# - het endpoint voor het indienen van informatievragen.
#
# Het aanbieden van CloudEvents zelf gebeurt via de generieke
# Asynchrone Interactie API.
#
# De scheiding is bewust:
# - AsynchroneInteracties.yaml beschrijft HOE events worden uitgewisseld.
# - Dit document beschrijft WELKE events binnen deze samenwerkfunctie bestaan.

openapi: 3.1.0

info:
  title: Uitwisselen Uitkomst Overleg API
  version: 2.0.0
  description: |
    Samenwerkfunctie-specifieke contracten voor CloudEvents en informatievragen.

    Deze specificatie bevat:
    - de CloudEvent-profielen die binnen deze samenwerkfunctie worden gebruikt;
    - de structuur van de CloudEvent-payload;
    - het endpoint voor het asynchroon stellen van informatievragen over de beschikbare informatie.

    De CloudEvent-profielen zijn opgenomen onder Components → Schemas.
    Het aanbieden van CloudEvents zelf gebeurt via de generieke
    Asynchrone Interactie API.

    Een informatievraag wordt asynchroon verwerkt. Bij acceptatie wordt
    een interactieId geretourneerd. De status van de verwerking kan worden
    opgevraagd via GET /interacties/{interactieId}. Het resultaat wordt opgehaald via
    GET /interacties/{interactieId}/resultaat en wordt als CloudEvent aangeboden.

externalDocs:
  description: Generieke Asynchrone Interactie API
  url: ./AsynchroneInteracties.yaml

tags:
  - name: Queryfunctionaliteit
    description: Informatievragen op de Knowledge Graph.

paths:

  /uitkomsten-overleg/query:
    post:
      tags:
        - Queryfunctionaliteit
      summary: Zoek beschikbare Uitkomsten Overleg
      description: |
        Zoekt beschikbare Uitkomsten Overleg in de Knowledge Graph.

        De queryfunctionaliteit bevraagt de informatie die beschikbaar is gesteld
        binnen de Knowledge Graph.

        Bij acceptatie wordt een interactieId geretourneerd. De status van
        de verwerking kan worden opgevraagd via GET /interacties/{interactieId}. Zodra de
        verwerking succesvol is afgerond, kan het resultaat worden opgehaald via
        GET /interacties/{interactieId}/resultaat.

        Het resultaat van een informatievraag is een CloudEvent. De data van dit
        CloudEvent bevat de gevonden informatie in PROV/JSON-LD-vorm.

        De verwerking van een informatievraag reconstrueert daarmee geen oorspronkelijke
        beschikbaarstellings- of inzagegebeurtenis. Het CloudEvent is het
        antwoordformaat voor de informatievraag; de PROV/JSON-LD-data beschrijft
        de gevonden informatie en de bijbehorende provenance.

        Een POST wordt gebruikt zodat zoekcriteria, waaronder mogelijk
        gevoelige gegevens zoals een BSN of een ander identificatienummer,
        geen onderdeel vormen van de URL.

        De identificatie van de Betrokkene bestaat uit een typering en een
        identificatiewaarde. De typering maakt duidelijk om welk soort nummer
        het gaat. De identifier van de Betrokkene in de Knowledge Graph is
        hiervan onderscheiden.

        Een queryresultaat identificeert de Betrokkene met de eigen identifier
        van het domeinobject. Identificatiegegevens worden als getypeerde
        combinaties weergegeven wanneer ze deel uitmaken van het resultaat.
      operationId: zoekUitkomstenOverleg

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              betrokkeneIdentificatie:
                identificatieType: "BSN"
                identificatie: "123456789"
              betrokkeneWoonplaats: "Deventer"

      responses:
        '202':
          description: Query geaccepteerd voor asynchrone verwerking.
          content:
            application/json:
              schema:
                $ref: './AsynchroneInteracties.yaml#/components/schemas/AcceptatieResponse'
              examples:
                geaccepteerd:
                  summary: Query geaccepteerd
                  value:
                    interactieId: "987e6543-e21b-45d6-b789-426614174111"
        '400':
          description: De informatievraag bevat ongeldige invoer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblemDetails'
              example:
                type: about:blank
                title: Ongeldige informatievraag
                status: 400
                detail: Een of meer zoekcriteria zijn ongeldig.
                errors:
                  - in: body
                    location: /beschikbaarVanaf
                    detail: Moet een geldige datum-tijdwaarde zijn.
                    code: date-time.format
        '406':
          description: De gevraagde response-indeling wordt niet ondersteund.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Niet acceptabel
                status: 406
                detail: De gevraagde response-indeling wordt niet ondersteund.
        '415':
          description: Het request bevat geen ondersteund mediatype.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Niet-ondersteund mediatype
                status: 415
                detail: Gebruik application/json voor de request-body.
        '500':
          description: Er is een onverwachte fout opgetreden bij het verwerken van de aanvraag.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Interne serverfout
                status: 500
                detail: De aanvraag kon door een onverwachte fout niet worden verwerkt.

components:

  examples:

    UitkomstBeschikbaarGesteldVoorbeeld:
      summary: CloudEvent waarmee een Uitkomst Overleg beschikbaar wordt gesteld
      value:
        specversion: "1.0"
        id: "019bb6c0-1234-7abc-8def-426614174003"
        source: "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e52"
        type: "nl.jzv.uitwisselen-uitkomst-overleg.uitkomst-beschikbaar-gesteld"
        time: "2026-01-15T10:30:00Z"
        subject: "casusoverleg-98765"
        datacontenttype: "application/ld+json"
        data:
          "@context":
            prov: "http://www.w3.org/ns/prov#"
            soh: "https://samen-onder-handbereik.github.io/specificaties/schema/"
          "@graph":
            - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e54"
              "@type":
                - "prov:Entity"
                - "soh:UitkomstOverleg"
              "soh:UitkomstOverleg.beschikbaarGesteldOp": "2026-01-15T10:30:00Z"
              "soh:UitkomstOverleg.heeftBetrokkene":
                "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e55"
            - "@id": "urn:uuid:019a8b7c-4d21-7e32-9a51-8c6f2b3d4e55"
